name: Release desktop

# Runs after the cargo-dist "Release" workflow so the GitHub Release exists.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.0.1
        required: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Mac signing and notarisation, only once the Apple secrets exist.
      - name: Apple signing
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$CERT" ]; then echo "No Apple secrets yet: the Mac app is unsigned."; exit 0; fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$API_KEY_P8" ]; then
            mkdir -p ~/private_keys
            printf '%s' "$API_KEY_P8" > ~/private_keys/AuthKey_$API_KEY.p8
            {
              echo "APPLE_API_ISSUER=$API_ISSUER"
              echo "APPLE_API_KEY=$API_KEY"
              echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_$API_KEY.p8"
            } >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files so installed copies trust them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG }}
          releaseName: ${{ env.TAG }}
          releaseDraft: false
          # Not a pre-release, so releases/latest/download/latest.json finds it.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # brew install --cask bit-gang-studio/tap/pando
  cask:
    needs: build
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Write the cask
        run: |
          VERSION="${TAG#v}"
          DMG="Pando_${VERSION}_universal.dmg"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$DMG"
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          git clone -q "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/bit-gang-studio/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/pando.rb <<CASK
          cask "pando" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/bit-gang-studio/pando/releases/download/v#{version}/Pando_#{version}_universal.dmg"
            name "Pando"
            desc "Simple, honest Git GUI where worktrees are first class"
            homepage "https://github.com/bit-gang-studio/pando"

            auto_updates true

            app "Pando.app"

            zap trash: "~/.config/pando"
          end
          CASK
          cd tap
          git config user.name "pando-release"
          git config user.email "pando-release@users.noreply.github.com"
          git add Casks/pando.rb
          git diff --cached --quiet && exit 0
          git commit -qm "pando $VERSION (app)"
          git push -q
