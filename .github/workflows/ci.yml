name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm --filter @pando/desktop build
      - run: cargo build --workspace

  # The oldest git we support (Apple ships 2.39). Core and CLI tests only.
  git-floor:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        id: git
        with:
          path: ~/git-2.39.5
          key: git-2.39.5-ubuntu-22.04
      - name: Build git 2.39.5
        if: steps.git.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev gettext zlib1g-dev
          curl -sL https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.39.5.tar.gz | tar xz
          make -C git-2.39.5 -j4 prefix=$HOME/git-2.39.5 NO_TCLTK=1 install >/dev/null
      - run: echo "$HOME/git-2.39.5/bin" >> $GITHUB_PATH
      - run: git --version | grep -q "2.39.5"
      - run: cargo test -p pando-core -p pando-cli
