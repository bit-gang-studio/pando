[package]
name = "pando-cli"
description = "Pando on the command line: list, add and remove git worktrees"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "pando"
path = "src/main.rs"

[dependencies]
pando-core = { path = "../core" }
clap.workspace = true
serde_json.workspace = true
dunce = "1.0.5"

[package.metadata.dist]
formula = "pando"

[dev-dependencies]
tempfile = "3.27.0"
